name: Build & Test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Swift version
        run: swift --version

      - name: Run Unit Tests
        run: swift test --parallel

      - name: Build DroidMac.app Bundle
        run: ./Scripts/build_app.sh

      - name: Package Release (.dmg & .zip)
        run: ./Scripts/package_release.sh 0.1.0-alpha

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DroidMac-macOS-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
